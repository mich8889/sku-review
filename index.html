<script>
const BIN_ID = "6a809684da38895dfee901cb";
const API_KEY = "$2a$10$WsczLRSPAGpgp48ZflZKreaWbQwukfVKuRoCIpadtaJnf.F323716";
function cleanTitle(t){ return (t||'').replace(/<[^>]*>/g,''); }
async function loadState(){
  try{
    const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {headers:{"X-Master-Key":API_KEY}});
    if(!r.ok) return [];
    const d = await r.json();
    return (d.record && d.record.checked) || [];
  }catch(e){ return []; }
}
async function saveState(checked){
  try{
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method:"PUT",
      headers:{"X-Master-Key":API_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({checked: checked})
    });
  }catch(e){}
}
function rebuildNav(){
  const nav = document.getElementById('checked-nav');
  if(!nav) return;
  const checked = Array.from(document.querySelectorAll('.remove-box:checked'));
  if(checked.length === 0){ nav.textContent = '尚未勾選任何商品'; return; }
  nav.innerHTML = '已勾選: ' + checked.map(cb =>
    `<a href="#card-${cb.dataset.sku}" style="color:#fff;text-decoration:underline;margin:0 6px;">${cleanTitle(cb.dataset.title)}</a>`
  ).join('');
}
async function init(){
  const state = await loadState();
  document.querySelectorAll('.remove-box').forEach(cb => {
    if(state.includes(cb.dataset.sku)) cb.checked = true;
    cb.addEventListener('change', async () => {
      const checked = Array.from(document.querySelectorAll('.remove-box:checked')).map(c => c.dataset.sku);
      await saveState(checked);
      rebuildNav();
    });
  });
  rebuildNav();
}
document.addEventListener('DOMContentLoaded', init);
</script>
